[package]
name = "openhantek-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
libusb1-sys = "0.7.0"
ratatui = "0.29"
rusb = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
toml_edit = "=0.25.19"

# The tests stream the fake scope at the top rate (32 MB/s) in real time;
# unoptimized code cannot make and bin the samples that fast.
[profile.test]
opt-level = 1

# The fake scope and the stream processing must keep up with 32 MB/s in
# real time, also in a debug build.
[profile.dev]
opt-level = 1
